name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Security: Limit job permissions
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # --- FRONTEND TEST JOB ---
  frontend-test:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # LTS version
          cache: 'npm' # Built-in npm caching

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm test

  # --- FAST BACKEND TESTS JOB ---
  fast-tests:
    name: Fast Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Much faster timeout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # Use latest for fast tests

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-fast-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-fast-

      - name: Install dependencies
        run: poetry install

      - name: Run fast unit tests
        run: poetry run test-fast

      - name: Run security tests
        run: poetry run test-security

  # --- COMPREHENSIVE BACKEND TEST JOB (with coverage) ---
  backend-test:
    name: Backend Tests with Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: fast-tests  # Only run if fast tests pass

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-${{ matrix.python-version }}-

      - name: Install dependencies
        run: poetry install

      - name: Set up environment variables
        run: |
          echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Run comprehensive tests with coverage
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          poetry run pytest -n auto \
            --cov=backend/core \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --junitxml=pytest-results.xml \
            --tb=short \
            -v

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            pytest-results.xml
            coverage.xml
            htmlcov/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'  # Only upload once
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # --- INTEGRATION TESTS JOB (separate, can be skipped for quick feedback) ---
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fast-tests  # Only run if fast tests pass
    # Allow this job to be skipped in draft PRs
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-integration-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-integration-

      - name: Install dependencies
        run: poetry install

      - name: Run integration tests
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: poetry run test-integration

  # --- LINT JOB ---
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Faster timeout for linting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv for linting
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-lint-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-lint-

      - name: Install dependencies for linting
        run: poetry install

      - name: Auto-fix formatting
        run: |
          poetry run black .
          poetry run isort .

      - name: Check remaining issues
        run: |
          poetry run flake8 . || echo "⚠️ Flake8 issues found - please fix manually"
          poetry run mypy backend/core --ignore-missing-imports || echo "⚠️ Type checking issues found - please fix manually"