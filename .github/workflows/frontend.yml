name: Frontend Checks

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'backend/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'backend/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'Dockerfile*'
      - 'docker-compose*.yml'

permissions:
  contents: read

jobs:
  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test
        continue-on-error: true  # Optional: if you don't have frontend tests yet

      - name: Build frontend
        run: npm run build

      - name: Type check
        run: npm run check
        continue-on-error: true  # Optional: if not configured