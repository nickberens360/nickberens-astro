name: Project PR Status Automation

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, closed]
  workflow_dispatch:

jobs:
  update-project-status:
    runs-on: ubuntu-latest
    env:
      PROJ_OWNER: nickberens360
      PROJ_NUMBER: '4'
    steps:
      - name: Update Issue Status from PR events
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.PROJ_TOKEN }}
        with:
          github-token: ${{ secrets.PROJ_TOKEN }}
          script: |
            const owner = process.env.PROJ_OWNER;
            const number = parseInt(process.env.PROJ_NUMBER, 10);
            const prNum = context.payload.pull_request.number;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;

            const isMerged = context.payload.pull_request.merged === true || (context.payload.action === 'closed' && context.payload.pull_request.merged);

            // 1) Resolve project + Status field + options
            const projQ = `query($login:String!,$number:Int!){
              user(login:$login){
                projectV2(number:$number){
                  id
                  fields(first:50){
                    nodes{ __typename id name ... on ProjectV2SingleSelectField { options { id name } } }
                  }
                }
              }
            }`;
            const proj = await github.graphql(projQ, { login: owner, number });
            const projectId = proj.user.projectV2.id;
            const fields = Object.fromEntries(proj.user.projectV2.fields.nodes.map(n => [n.name, n]));
            const statusField = fields['Status'];
            if (!statusField || statusField.__typename !== 'ProjectV2SingleSelectField') {
              core.setFailed('Status field not found on project');
              return;
            }
            const statusOpt = (name) => (statusField.options || []).find(o => o.name === name)?.id;
            const INPROG = statusOpt('In Progress');
            const DONE = statusOpt('Done');
            const TODO = statusOpt('Todo');

            // 2) Find closing issues referenced by this PR (Closes/Fixes/Resolves)
            const prQ = `query($owner:String!,$name:String!,$number:Int!){
              repository(owner:$owner, name:$name){
                pullRequest(number:$number){
                  number
                  closingIssuesReferences(first:50){ nodes{ id number title } }
                }
              }
            }`;
            const prData = await github.graphql(prQ, { owner: repoOwner, name: repoName, number: prNum });
            const closingIssues = prData.repository.pullRequest.closingIssuesReferences.nodes || [];
            if (closingIssues.length === 0) {
              core.info('No closing-issues references found on this PR; skipping.');
              return;
            }

            // Helpers
            async function ensureInProject(issueNodeId){
              const mut = `mutation($project:ID!,$content:ID!){ addProjectV2ItemById(input:{projectId:$project, contentId:$content}){ item{ id } } }`;
              try { await github.graphql(mut, { project: projectId, content: issueNodeId }); } catch(e){ core.info(`addProjectV2ItemById skipped: ${e.message}`); }
            }
            async function getProjectItemId(issueNodeId){
              const q = `query($issue:ID!){ node(id:$issue){ ... on Issue { projectV2(first:20){ nodes{ id project{ id } } } } } }`;
              const data = await github.graphql(q, { issue: issueNodeId });
              const items = data.node?.projectV2?.nodes || [];
              const m = items.find(n => n.project?.id === projectId);
              return m?.id;
            }
            async function setStatus(itemId, optionId){
              if (!optionId) return;
              const mut = `mutation($project:ID!,$item:ID!,$field:ID!,$opt:String!){ updateProjectV2ItemFieldValue(input:{ projectId:$project, itemId:$item, fieldId:$field, value:{ singleSelectOptionId:$opt } }){ projectV2Item{ id } } }`;
              await github.graphql(mut, { project: projectId, item: itemId, field: statusField.id, opt: optionId });
            }

            // 3) Apply transitions: PR opened -> In Progress; PR merged -> Done; PR closed unmerged -> Todo
            const targetStatus = isMerged ? DONE : (context.payload.action === 'closed' ? TODO : INPROG);

            for (const iss of closingIssues) {
              await ensureInProject(iss.id);
              const itemId = await getProjectItemId(iss.id);
              if (!itemId) { core.warning(`Project item not found for issue #${iss.number}`); continue; }
              await setStatus(itemId, targetStatus);
              core.info(`Updated Issue #${iss.number} to status option ${targetStatus}`);
            }

            core.info('Project status updated for closing issues.');

    permissions:
      contents: read
      issues: read
      pull-requests: read
