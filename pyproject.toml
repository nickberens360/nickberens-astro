[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"
python_files = "test_*.py"
python_functions = "test_*"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--cov=backend/core",
    "--cov-report=html",
    "--cov-report=term-missing"
]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (slower, may require external resources)",
    "slow: marks tests as slow running tests"
]
filterwarnings = []

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/.eggs/*",
    "*/.git/*",
    "*/.hg/*",
    "*/.mypy_cache/*",
    "*/.tox/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
    "*/_build/*",
    "*/buck-out/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
known_first_party = ["backend", "tests"]

[tool.flake8]
extend-ignore = ["E203", "W503", "E501", "E301", "E302", "E303", "E305", "W292"]
per-file-ignores = [
    "tests/*:E402",
    "tests/**/*:E402"
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.mypy]
disable_error_code = ["no-redef"]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false
strict_equality = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"
pytest-mock = "^3.14.1"
pytest-cov = "^6.2.1"
pytest-xdist = "^3.8.0"
black = "^25.1.0"
flake8 = "^7.3.0"
isort = "^6.0.1"
mypy = "^1.17.1"
autoflake = "^2.3.1"
pre-commit = "^4.2.0"

[project]
name = "nickberens"
version = "0.1.0"
description = "Portfolio application"
authors = [
    {name = "Nick Berens",email = "nickberens360@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "llama-index>=0.13.0,<0.14.0",
    "llama-index-llms-anthropic>=0.8.0,<0.9.0",
    "llama-index-embeddings-huggingface>=0.6.0,<0.7.0",
    "fastapi>=0.116.1,<0.117.0",
    "uvicorn[standard]>=0.35.0,<0.36.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "python-docx>=1.0.0,<2.0.0",
    "slowapi>=0.1.9,<0.2.0"
]

[tool.poetry]
packages = [
    { include = "backend" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
