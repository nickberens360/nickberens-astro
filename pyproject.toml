[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"
python_files = "test_*.py"
python_functions = "test_*"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--cov=backend/core",
    "--cov-report=html",
    "--cov-report=term-missing"
]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (slower, may require external resources)",
    "slow: marks tests as slow running tests"
]
filterwarnings = []

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/.eggs/*",
    "*/.git/*",
    "*/.hg/*",
    "*/.mypy_cache/*",
    "*/.tox/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
    "*/_build/*",
    "*/buck-out/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
known_first_party = ["backend", "tests"]

[tool.flake8]
extend-ignore = [
    "E203",  # whitespace before ':'
    "W503",  # line break before binary operator
    "E501",  # line too long (Black handles this)
    "E301",  # expected 1 blank line
    "E302",  # expected 2 blank lines
    "E303",  # too many blank lines
    "E305",  # expected 2 blank lines after class or function definition
    "F401",  # imported but unused (common in __init__.py)
    "F841",  # local variable assigned but never used
    "W601",  # .has_key() is deprecated
]
per-file-ignores = [
    "tests/*:E402,F401,F811",
    "tests/**/*:E402,F401,F811",
    "backend/ingest/*:F401,E501",
    "backend/**/__init__.py:F401",
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.mypy]
python_version = "3.11"
# Relaxed settings for faster development
ignore_missing_imports = true
no_strict_optional = true
allow_untyped_calls = true
allow_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false  # Reduced noise from type: ignore comments
warn_no_return = false
warn_unreachable = false
strict_equality = false
# Keep some useful checks
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

