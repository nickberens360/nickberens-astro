# Configuration for RAG data sources
data_sources:
  base_path: "public"
  output_file: "unified_data.json"
  sources:
    - name: "resume"
      file: "resume.json"
      sections:
        - name: "summary"
          field: "summary"
          template: "summary_template"
        - name: "experience"
          field: "experience"
          is_list: true
          item_fields:
            - company
            - role
            - dates
            - points
          template: "experience_template"
          metadata_fields:
            - company
            - role
        - name: "education"
          field: "education"
          is_list: true
          item_fields:
            - institution
            - degree
            - dates
          template: "education_template"
          metadata_fields:
            - institution
        - name: "accomplishments"
          field: "accomplishments"
          is_list: true
          item_fields:
            - title
            - description
          template: "accomplishments_template"

    - name: "about"
      file: "about.json"
      sections:
        - name: "introduction"
          field: "introduction"
          template: "about_introduction_template"
        - name: "sections"
          field: "sections"
          is_list: true
          item_fields:
            - heading
            - content
          template: "about_sections_template"
          metadata_section_field: "heading"

    - name: "illustrations"
      file: "illustrations.json"
      is_list_source: true
      item_fields:
        - title
        - file
        - tags
      template: "illustrations_template"
      metadata_fields:
        - file
        - title
      special_processing:
        tags:
          type: "join_array"
          separator: ", "

# Retriever configurations
retrievers:
  resume:
    description: "Good for answering questions about Nick's professional work experience, previous roles, job history, and technical skills."
    search_kwargs:
      k: 8
    keywords:
      - experience
      - job
      - work
      - skill
      - resume
      - cv
      - company
      - role
      - hillman
      - wisnet
      - history

  about:
    description: "Good for answering questions about Nick's background, personal interests, and general professional philosophy."
    search_kwargs:
      k: 5
    keywords:
      - about
      - background
      - who is
      - philosophy
      - approach
      - inspiration
      - artistic

  illustration:
    description: "Good for answering questions about Nick's art, illustrations, creative process, and artistic style."
    search_kwargs:
      k: 5
    keywords:
      - art
      - illustration
      - drawing
      - picture
      - character
      - design
      - inspiration
      - artistic
      - creative
      - process
      - style
  knowledge:
    description: "Good for answering detailed questions about Nick's expertise, technical background, and specific skills from ingested documents."
    search_kwargs:
      k: 8
    keywords:
      - expertise
      - technical
      - background
      - css
      - frontend
      - backend
      - ai
      - development
      - framework
      - architecture
      - design system

# Collection configuration
collection:
  name_pattern: "nickberens_{source}"

# System prompts
prompts:
  qa_system: |
    You are Nick Berens' expert digital assistant. Your role is to answer questions about his skills, experience, and work based *only* on the provided context. Speak in a helpful and professional tone.
    
    **CRITICAL INSTRUCTIONS:**
    
    1.  **Persona:** When the user asks about 'you' or 'your' experience (e.g., 'What is your experience?'), always respond about Nick Berens in the third person (e.g., 'Nick's experience is...').
    
    2.  **Resume Requests:** If asked for the resume (e.g., 'Show me your resume'), synthesize the provided resume context into a clear, professional summary. **NEVER** state that you are an AI or do not have a resume. The user is asking for Nick's resume, and the context provided is the source for it.
    
    3.  **Stick to the Context:** If the answer is not in the provided context, clearly state that the information is not available. Do not make up answers.
    
    4.  **Formatting:** Use markdown, such as bullet points, to structure information like work experience or skills for readability.
    
    **Provided Context:**
    {context}

  history_aware: |
    Given a chat history and the latest user question which might reference the chat history, formulate a standalone question which can be understood without the chat history. Do NOT answer the question, just reformulate it if needed and otherwise return it as is.

# Content formatting templates
templates:
  # Resume templates
  summary_template: "Summary: {summary}"

  experience_template: |
    Company: {company}
    Role: {role}
    Dates: {dates}
    Responsibilities:
    {points_formatted}

  education_template: |
    Institution: {institution}
    Degree: {degree}
    Dates: {dates}

  accomplishments_template: "{title}: {description}"

  # About templates
  about_introduction_template: "{introduction}"
  about_sections_template: "{heading}: {content}"

  # Illustrations template
  illustrations_template: |
    Title: {title}
    Tags: {tags}

# Special processing configurations
special_processing:
  points:
    type: "format_list"
    format: "bullet_points"
    empty_message: "No points listed"
  tags:
    type: "join_array"
    separator: ", "
    default: ""